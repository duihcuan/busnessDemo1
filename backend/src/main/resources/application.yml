server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agri_ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
sa-token:
  token-name: satoken
  timeout: 2592000
  is-concurrent: true
  is-log: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
wx:
  appid: ""
  secret: ""
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
rag:
  bge-model-path: backend/models/bge-small-zh-v1.5.onnx
  top-k: 3

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com
  model: text-embedding-v3
